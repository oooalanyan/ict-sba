<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese Chess Knockdown System</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Chinese Chess Knockdown System</h1>

    <!-- Bracket Display Area -->
    <div id="bracket"></div>

    <!-- Bottom Section: Info Bar above Import / Export / Next Tournament Buttons -->
    <div class="bottom-bar">
      <div class="box" id="info">Loading...</div>

      <input type="file" id="file-input" accept=".csv" style="display:none" />
      <button class="big-btn" style="background:#99ccff" id="btn-import">Import CSV</button>
      <button class="big-btn" style="background:#99ff99" id="btn-export">Export CSV</button>
      <button class="big-btn" style="background:#ffff99" id="btn-next">Start Next Round (Load CSV)</button>

    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
